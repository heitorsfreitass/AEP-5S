<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="top-nav">
    <a class="brand" href="/">
        <i class="bi bi-bank2"></i>
        Sistema de Solicitações Urbanas
    </a>

    <div class="d-flex align-items-center gap-3">
        <!-- Nome do usuário logado -->
        <span class="user-pill" th:if="${usuarioLogado != null}">
            <i class="bi bi-person-circle"></i>
            Olá, <strong th:text="${usuarioLogado.nomeExibicao}">Usuário</strong>
            <span class="user-badge"
                  th:text="${usuarioLogado.admin ? 'Admin' : 'Cidadão'}"
                  th:classappend="${usuarioLogado.admin} ? 'badge-admin' : 'badge-cidadao'">
            </span>
        </span>
        <span class="user-pill" th:unless="${usuarioLogado != null}">
            <i class="bi bi-person-circle"></i>
            Olá, Visitante
        </span>

        <!-- Logout -->
        <a th:if="${usuarioLogado != null}" href="/logout"
           class="btn btn-sm btn-outline-light" style="font-size:.8rem;padding:.25rem .7rem;">
            <i class="bi bi-box-arrow-right"></i> Sair
        </a>
        <a th:unless="${usuarioLogado != null}" href="/login"
           class="btn btn-sm btn-outline-light" style="font-size:.8rem;padding:.25rem .7rem;">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
        </a>
    </div>
</nav>
</body>
</html>
