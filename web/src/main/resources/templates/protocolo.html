<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Consultar Protocolo')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('Visitante')}"></nav>

<div class="container py-4" style="max-width:760px;">

    <p class="pg-title">Consultar Protocolo</p>
    <p class="pg-subtitle">Informe o número do protocolo para acompanhar sua solicitação.</p>

    <!-- Busca -->
    <div class="card mb-4">
        <div class="card-body p-3">
            <form action="/protocolo" method="get" class="d-flex gap-2">
                <input type="text" class="form-control" name="protocolo"
                       placeholder="Digite o número do protocolo"
                       th:value="${param.protocolo}">
                <button type="submit" class="btn btn-primary px-4" style="white-space:nowrap;">
                    <i class="bi bi-search me-1"></i> Buscar
                </button>
            </form>
        </div>
    </div>

    <!-- Erro -->
    <div th:if="${erro}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
    </div>

    <!-- Resultado -->
    <div th:if="${solicitacao}" class="card">
        <!-- Cabeçalho do protocolo -->
        <div class="card-header-custom justify-content-between">
            <span>Protocolo: <strong th:text="${solicitacao.protocolo}"></strong></span>
            <span class="bs"
                  th:classappend="'s-' + ${#strings.toLowerCase(solicitacao.status.name())}"
                  th:text="${solicitacao.status.name().replace('_',' ')}">
            </span>
        </div>

        <div class="card-body p-4">
            <!-- Grid de info -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="text-secondary mb-1" style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Categoria</div>
                    <div th:text="${solicitacao.categoria.descricao}" style="font-size:.9rem;"></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="text-secondary mb-1" style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Prioridade</div>
                    <span class="bs"
                          th:classappend="'p-' + ${#strings.toLowerCase(solicitacao.prioridade.name())}"
                          th:text="${solicitacao.prioridade.name()}">
                    </span>
                </div>
                <div class="col-6 col-md-3">
                    <div class="text-secondary mb-1" style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Data de Abertura</div>
                    <div th:text="${#temporals.format(solicitacao.dataAbertura,'dd/MM/yyyy HH:mm')}" style="font-size:.9rem;"></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="text-secondary mb-1" style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Previsão (SLA)</div>
                    <div style="font-size:.9rem;"
                         th:text="${#temporals.format(solicitacao.prazoAlvo,'dd/MM/yyyy HH:mm')}"
                         th:class="${solicitacao.prazoAlvo.isBefore(agora)} ? 'sla-late' : 'sla-ok'">
                    </div>
                </div>
            </div>

            <!-- Descrição -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="text-secondary mb-1" style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Localização</div>
                    <div th:text="${solicitacao.localizacao ?: '—'}" style="font-size:.9rem;"></div>
                </div>
                <div class="col-md-8">
                    <div class="text-secondary mb-1" style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Descrição</div>
                    <div th:text="${solicitacao.descricao}" style="font-size:.9rem; color:#374151;"></div>
                </div>
            </div>

            <!-- Histórico -->
            <div th:if="${not #lists.isEmpty(solicitacao.historico)}">
                <div class="text-secondary mb-2" style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Histórico de Status</div>
                <ul class="timeline">
                    <li th:each="h : ${solicitacao.historico}"
                        th:classappend="'s-' + ${#strings.toLowerCase(h.statusNovo.name())}">
                        <div>
                            <div style="font-size:.78rem;color:#94a3b8;margin-bottom:.2rem;"
                                 th:text="${#temporals.format(h.dataHora,'dd/MM/yyyy HH:mm')}">
                            </div>
                            <span class="bs me-2"
                                  th:classappend="'s-' + ${#strings.toLowerCase(h.statusNovo.name())}"
                                  th:text="${h.statusNovo.name().replace('_',' ')}">
                            </span>
                            <span style="font-size:.87rem;color:#374151;" th:text="${h.comentario}"></span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
