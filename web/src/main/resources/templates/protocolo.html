<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Consultar Protocolo')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('Visitante')}"></nav>

<div class="container py-4" style="max-width:760px;">

    <div class="mb-3">
        <a href="/" class="text-decoration-none text-secondary" style="font-size:.9rem;">
            <i class="bi bi-arrow-left"></i> Voltar ao início
        </a>
    </div>

    <p class="page-title">Consultar Protocolo</p>
    <p class="page-subtitle">Informe o número do protocolo para acompanhar sua solicitação.</p>

    <!-- Busca -->
    <div class="card mb-4">
        <div class="card-body p-3">
            <form action="/protocolo" method="get" class="d-flex gap-2">
                <input type="text" class="form-control" name="protocolo"
                       placeholder="Ex: OA-2025-AB12CD"
                       th:value="${param.protocolo}">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-search"></i> Buscar
                </button>
            </form>
        </div>
    </div>

    <!-- Erro -->
    <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${erro}"></span>
    </div>

    <!-- Resultado -->
    <div th:if="${solicitacao}" class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Protocolo: <strong th:text="${solicitacao.protocolo}"></strong></span>
            <span class="badge-status"
                  th:classappend="'s-' + ${#strings.toLowerCase(solicitacao.status.name())}"
                  th:text="${solicitacao.status.name().replace('_',' ')}">
            </span>
        </div>
        <div class="card-body p-4">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="text-secondary" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Categoria</div>
                    <div th:text="${solicitacao.categoria.descricao}"></div>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Prioridade</div>
                    <span class="badge-status"
                          th:classappend="'p-' + ${#strings.toLowerCase(solicitacao.prioridade.name())}"
                          th:text="${solicitacao.prioridade.name()}">
                    </span>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Solicitante</div>
                    <div th:text="${solicitacao.solicitante.nome}"></div>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Data de Abertura</div>
                    <div th:text="${#temporals.format(solicitacao.dataAbertura,'dd/MM/yyyy HH:mm')}"></div>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Previsão (SLA)</div>
                    <div th:text="${#temporals.format(solicitacao.prazoAlvo,'dd/MM/yyyy HH:mm')}"
                         th:classappend="${solicitacao.prazoAlvo.isBefore(agora)} ? 'sla-atrasado' : 'sla-ok'">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Localização</div>
                    <div th:text="${solicitacao.localizacao ?: '—'}"></div>
                </div>
            </div>

            <div class="mb-4">
                <div class="text-secondary mb-1" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Descrição</div>
                <div class="bg-light rounded p-3" th:text="${solicitacao.descricao}"></div>
            </div>

            <!-- Histórico -->
            <div th:if="${not #lists.isEmpty(solicitacao.historico)}">
                <div class="text-secondary mb-2" style="font-size:.8rem;text-transform:uppercase;font-weight:600;">Histórico de Status</div>
                <ul class="timeline">
                    <li th:each="h : ${solicitacao.historico}"
                        th:classappend="'s-' + ${#strings.toLowerCase(h.statusNovo.name())}">
                        <div>
                            <div style="font-size:.82rem;color:#888;" th:text="${#temporals.format(h.dataHora,'dd/MM/yyyy HH:mm')}"></div>
                            <span class="badge-status me-1"
                                  th:classappend="'s-' + ${#strings.toLowerCase(h.statusNovo.name())}"
                                  th:text="${h.statusNovo.name().replace('_',' ')}">
                            </span>
                            <span style="font-size:.88rem;" th:text="${h.comentario}"></span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
