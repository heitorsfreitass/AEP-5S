<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Consultar Protocolo')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('Visitante')}"></nav>

<div class="container py-4" style="max-width:800px;">

    <h4 class="fw-bold mb-1">Consultar Protocolo</h4>
    <p class="text-secondary mb-4" style="font-size:.92rem;">
        Informe o número do protocolo para acompanhar sua solicitação.
    </p>

    <!-- Busca -->
    <div class="card mb-4">
        <div class="card-body p-3">
            <form action="/protocolo" method="get" class="d-flex gap-2">
                <input type="text" class="form-control" name="protocolo"
                       placeholder="Digite o número do protocolo"
                       th:value="${param.protocolo}">
                <button type="submit" class="btn btn-primary px-4" style="white-space:nowrap;">
                    <i class="bi bi-search me-1"></i>Buscar
                </button>
            </form>
        </div>
    </div>

    <!-- Erro -->
    <div th:if="${erro}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
    </div>

    <!-- Resultado -->
    <div th:if="${solicitacao}" class="card">

        <!-- Header: protocolo + badge status -->
        <div class="d-flex justify-content-between align-items-center px-4 py-3"
             style="border-bottom:1px solid #e5e7eb;">
            <span class="fw-bold" style="font-size:1rem;">
                Protocolo: <span th:text="${solicitacao.protocolo}"></span>
            </span>
            <span class="bs"
                  th:classappend="'s-' + ${#strings.toLowerCase(solicitacao.status.name())}"
                  th:text="${solicitacao.status.name().replace('_',' ')}">
            </span>
        </div>

        <div class="card-body p-4">

            <!-- Grid de metadados -->
            <div class="row g-4 mb-4">
                <div class="col-6 col-md-3">
                    <div class="info-lbl">Categoria</div>
                    <div class="info-val" th:text="${solicitacao.categoria.descricao}"></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="info-lbl">Prioridade</div>
                    <span class="bs"
                          th:classappend="'p-' + ${#strings.toLowerCase(solicitacao.prioridade.name())}"
                          th:text="${solicitacao.prioridade.name()}">
                    </span>
                </div>
                <div class="col-6 col-md-3">
                    <div class="info-lbl">Data de abertura</div>
                    <div class="info-val"
                         th:text="${#temporals.format(solicitacao.dataAbertura,'dd/MM/yyyy HH:mm')}">
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="info-lbl">Previsão (SLA)</div>
                    <div th:text="${#temporals.format(solicitacao.prazoAlvo,'dd/MM/yyyy HH:mm')}"
                         th:class="${solicitacao.prazoAlvo.isBefore(agora)} ? 'info-val sla-late' : 'info-val sla-ok'">
                    </div>
                </div>
            </div>

            <!-- Descrição (layout 2 colunas, igual ao mockup) -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="info-lbl">Localização</div>
                    <div class="info-val" th:text="${solicitacao.localizacao ?: '—'}"></div>
                </div>
                <div class="col-md-8">
                    <div class="info-lbl">Descrição</div>
                    <div class="info-val" th:text="${solicitacao.descricao}"></div>
                </div>
            </div>

            <!-- Histórico de Status -->
            <div th:if="${not #lists.isEmpty(solicitacao.historico)}">
                <div class="info-lbl mb-3">Histórico de Status</div>
                <ul class="timeline">
                    <li th:each="h : ${solicitacao.historico}"
                        th:classappend="'s-' + ${#strings.toLowerCase(h.statusNovo.name())}">
                        <div style="padding:.1rem 0;">
                            <div style="font-size:.8rem;color:#9ca3af;margin-bottom:.25rem;"
                                 th:text="${#temporals.format(h.dataHora,'dd/MM/yyyy HH:mm')}">
                            </div>
                            <span class="bs me-2"
                                  th:classappend="'s-' + ${#strings.toLowerCase(h.statusNovo.name())}"
                                  th:text="${h.statusNovo.name().replace('_',' ')}">
                            </span>
                            <span style="font-size:.9rem;color:#374151;"
                                  th:text="${h.comentario}">
                            </span>
                        </div>
                    </li>
                </ul>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
