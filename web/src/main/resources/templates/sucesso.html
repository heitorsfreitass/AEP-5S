<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Solicitação Enviada')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5 text-center" style="max-width:520px;">
    <div class="card p-5">
        <i class="bi bi-check-circle-fill text-success mb-3" style="font-size:3.5rem;"></i>
        <h4 class="fw-bold mb-2">Solicitação enviada com sucesso!</h4>
        <p class="text-secondary mb-4">Guarde o número do protocolo abaixo para acompanhar sua solicitação.</p>

        <div class="bg-light rounded-3 p-3 mb-4">
            <span class="text-secondary" style="font-size:.85rem;">Número do Protocolo</span>
            <div class="fw-bold fs-4 mt-1" th:text="${protocoloGerado}" style="letter-spacing:.05em;color:#1a3a6b;">—</div>
        </div>

        <div class="d-flex gap-2 justify-content-center">
            <a th:href="@{/protocolo(protocolo=${protocoloGerado})}" class="btn btn-primary">
                <i class="bi bi-search"></i> Acompanhar
            </a>
            <a href="/" class="btn btn-outline-secondary">Voltar ao início</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
